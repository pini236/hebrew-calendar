name: Android app

# Every push builds an installable test APK.
# When the signing secrets are set (see PUBLISHING.md) it also builds the signed .aab that Google Play
# needs, and when the Play service account is set (PLAY_SERVICE_ACCOUNT_JSON) every push uploads it to
# Google Play by itself: to the track in the repository variable PLAY_TRACK (default: internal).
on:
  push:
    paths:
      - 'src/**'
      - 'android/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: 'Upload the signed bundle to Google Play'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          # keep Gradle's downloads between runs: Maven Central sometimes answers 429 (too many requests)
          cache: gradle
      - run: npm ci
      - name: Accuracy check (zmanim vs. a second library)
        run: npm run verify
      - name: Unit tests (notification plan, location search)
        run: npm test
      - name: Build web app and copy it into the Android project
        run: npm run build:native && npx cap sync android

      - name: Build test APK
        working-directory: android
        # a failed download (Maven Central's 429) is retried after a pause
        run: |
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Gradle failed (attempt $i), retrying in $((i * 45)) s"; sleep $((i * 45))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed bundle for Google Play
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          ./gradlew bundleRelease --no-daemon
          rm -f "$ANDROID_KEYSTORE_FILE"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        # every push; a manual run only when its checkbox is on
        if: env.HAS_KEYSTORE == 'true' && env.HAS_PLAY == 'true' && (github.event_name == 'push' || inputs.upload_to_play)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.rooftopaistudio.luachyehudi
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed
